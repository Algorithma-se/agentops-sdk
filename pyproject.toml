[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentops-sdk"
version = "0.4.0"
description = "AgentOps Python SDK — tracing, prompts, guardrails, and content management"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentOps" }]
dependencies = [
  "langfuse>=2.0.0,<3.0",
  "requests>=2.28.0",
  "httpx>=0.25.0",
  "jinja2>=3.1.0",
  # Included so `AGENTOPS_CLOUD_RUN_INVOKER_AUTH=true` works without a
  # separate `pip install` step — common deployment pattern is to
  # install the SDK at image-build time and flip the env var at deploy
  # time. ~1-2 MB; no runtime cost when the flag is off (lazy import).
  "google-auth>=2.29.0",
]

[project.optional-dependencies]
async = [
  "aiofiles>=23.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentops = ["py.typed"]


